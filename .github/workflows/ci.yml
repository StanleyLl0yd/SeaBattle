name: CI and GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sea-battle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Game tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax across the repository
        run: git ls-files -z '*.js' '*.mjs' '*.cjs' | xargs -0 -r -n1 node --check
      - name: Verify game logic
        run: npm test

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp favicon.ico dist/favicon.ico
          mkdir -p dist/assets
          cp assets/seabattle-icon.svg dist/assets/seabattle-icon.svg
          cp assets/icon-192.png assets/icon-512.png dist/assets/
          cp manifest.webmanifest sw.js dist/
          cp -R js dist/js
          touch dist/.nojekyll
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  release:
    name: Publish v1.2.1 GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Publish stable v1.2.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -Eq '^[[:space:]]*"version":[[:space:]]*"1\.2\.1",' package.json || exit 0
          if gh release view v1.2.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.2.1 already exists; nothing to change."
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.2.1" >/dev/null 2>&1; then
            echo "::error::v1.2.1 tag already exists without a release; refusing to move it."
            exit 1
          fi
          awk '/^## \[1\.2\.1\]/ {reading=1} /^## \[1\.2\.0\]/ {reading=0} reading' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          gh release create v1.2.1 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SeaBattle 1.2.1" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
